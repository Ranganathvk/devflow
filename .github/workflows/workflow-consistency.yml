name: Workflow consistency

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Check workflow consistency and safety invariants
        run: python -m unittest discover -s tests -v
